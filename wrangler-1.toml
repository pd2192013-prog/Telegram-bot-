name = "maths-doubt-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

# KV namespace used for storing users, plans, settings, admin session.
# Create it with:  npx wrangler kv namespace create BOT_DATA
# Then paste the returned id below.
[[kv_namespaces]]
binding = "BOT_DATA"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Durable Object used ONLY for atomic per-user rate limiting (accurate counting,
# no race conditions even if many messages arrive at the same time).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# Secrets (set these with `npx wrangler secret put NAME`, do NOT put them here):
#   BOT_TOKEN        -> your Telegram bot token from @BotFather
#   GROQ_API_KEY      -> your Groq Cloud API key
#   GROQ_MODEL        -> e.g. "llama-3.3-70b-versatile"
#   ADMIN_PASSWORD    -> password that opens the admin panel
# Optional:
#   ADMIN_ID          -> Telegram numeric id allowed to see the admin panel
#                        (defaults to 8054528325 if not set)
